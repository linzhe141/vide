name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Ensure GitHub release exists
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '')
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              })
              core.info(`Release for ${tag} already exists`)
            } catch (error) {
              if (error.status !== 404) throw error
              try {
                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  name: tag,
                  draft: true,
                })
                core.info(`Created draft release for ${tag}`)
              } catch (createError) {
                if (createError.status !== 422) throw createError
                core.info(`Release for ${tag} was created in parallel`)
              }
            }

      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm prebuild

      - run: pnpm exec electron-builder --config electron-builder.config.ts --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
