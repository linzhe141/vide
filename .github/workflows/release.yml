name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs')
            const { owner, repo } = context.repo
            const tag = process.env.RELEASE_TAG
            const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            const expectedTag = `v${packageJson.version}`

            if (tag !== expectedTag) {
              core.setFailed(`Release tag ${tag} does not match package version ${packageJson.version}`)
              return
            }

            const prerelease = tag.includes('-')

            try {
              const { data: existingRelease } = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              })

              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: existingRelease.id,
                tag_name: tag,
                name: tag,
                draft: false,
                prerelease,
                target_commitish: context.sha,
              })
              core.info(`Using existing release for ${tag}`)
            } catch (error) {
              if (error.status !== 404) {
                throw error
              }

              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: tag,
                draft: false,
                prerelease,
                target_commitish: context.sha,
              })
              core.info(`Created release for ${tag}`)
            }

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install -g pnpm@10.5.1

      - run: pnpm install --frozen-lockfile

      - run: pnpm release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_TYPE: tag
          GITHUB_REF_NAME: ${{ env.RELEASE_TAG }}
          EP_PRE_RELEASE: ${{ contains(env.RELEASE_TAG, '-') }}
